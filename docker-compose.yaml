networks:
  app-net:
    driver: bridge

services:
  mysql:
    image: mysql/mysql-server:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billDb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: America/New_York
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  springboot:
    build: ./springboot-api
    container_name: springboot
    environment:
      HOST: mysql
    ports:
      - "8080:8080"
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/summary 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  primevue:
    build: ./primevue-ui
    container_name: primevue
    ports:
      - "8000:80"
    networks:
      - app-net
    depends_on:
      springboot:
        condition: service_healthy
